name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'acaineiro-app/www/**'
      - 'acaineiro-app/android/**'
      - 'acaineiro-app/capacitor.config.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: acaineiro-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: acaineiro-app-release
          path: acaineiro-app/android/app/build/outputs/apk/release/*.apk
